<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Chat Unificado</title>
        <style>
            body {
                background-color: transparent; /* Fondo transparente */
                color: #fff;
                font-family: 'Consolas', 'Courier New', Courier, monospace,'Times New Roman','Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
                margin: 0;
                padding: 0.5em;
                overflow-y: auto;
                height: 100vh;
            }
            #chat {
                max-width: 100%;
                height: 600px;        /* altura fija del área de chat */
                overflow-y: auto;     /* activa el scroll vertical */
                display: flex;
                flex-direction: column;
                /*flex-direction: column-reverse;*/

                /* Ocultar scroll en Webkit (Chrome, Edge, Safari) */
                scrollbar-width: none; /* Firefox */
                -ms-overflow-style: none;  /* IE 10+ */
            }

            #chat::-webkit-scrollbar {
            width: 0px;
            background: transparent; /* opcional: transparentar el scrollbar */
            }
            .message {
                margin-bottom: 0.3em;
                line-height: 1.2em;
                font-size: 15px;
            }
            .username {
                font-weight: bold;
                margin-right: 0.3em;
            }
            .platform {
                font-size: 0.75em;
                color: #999;
                margin-left: 0.3em;
            }
            .text {
                color: rgb(0, 255, 0); /* Verde consola para todos los mensajes */
            }
            /* Colores para el nombre de usuario según plataforma */
            .username.twitch {
                color: purple; /* morado */
            }
            .username.kick {
                color: rgb(0, 255, 0); /* verde consola */
            }
            .username.youtube {
                color: red; /*Rojo*/
            }
            .username.rumble {
                color: #00BFFF; /* azul eléctrico */
            }
        </style>
    </head>
    <body>
        <div id="chat"></div>

        <script>

        const chat = document.getElementById('chat');
        const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
        const socket = new WebSocket(`${protocol}//${location.host}/message`);

        socket.addEventListener('open', () => {
        console.log('✅ WebSocket conectado');
        });

        socket.addEventListener('close', () => {
        console.warn('⚠️ WebSocket desconectado, reconectando en 3s...');
        setTimeout(() => location.reload(), 3000);
        });

        socket.addEventListener('message', ({ data }) => {
        try {
            const msg = JSON.parse(data);
            const div = document.createElement('div');
            div.className = 'message';

            const userSpan = document.createElement('span');
            userSpan.className = 'username ' + (msg.platform?.toLowerCase() || 'unknown');
            userSpan.textContent = msg.username || 'anon';

            const textSpan = document.createElement('span');
            textSpan.className = 'text';
            textSpan.textContent = `: ${msg.message || ''}`;

            div.append(userSpan, textSpan);
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        } catch (e) {
            console.error('❌ Error al parsear mensaje:', e);
        }
        });
        </script>
    </body>
