# ════════════════════════════════════════════════════════════════════════════
# BatchProcessor · configuración principal
#
# Los tests no tocan este fichero: el perfil "test"
# (src/test/resources/application-test.properties) se superpone a él y cambia
# solo lo necesario (H2 en memoria en lugar de MySQL, rutas de salida...).
# ════════════════════════════════════════════════════════════════════════════
spring.application.name=BatchProcessor

# Puerto HTTP de la aplicación (Swagger en /swagger-ui/index.html).
server.port=8080

# ── Base de datos principal (MySQL) ─────────────────────────────────────────
# Origen de los lectores de BD, destino de databaseItemWriter y almacén de
# las tablas BATCH_* de Spring Batch. La base "generic" se crea sola.
# Credenciales de desarrollo local: no usar estas en ningún despliegue.
spring.datasource.url=jdbc:mysql://localhost:3306/generic?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=1234
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA Conf
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# create: Hibernate BORRA y vuelve a crear las tablas de las entidades en cada
# arranque. Cómodo para desarrollar; con datos que importen, usar update o
# validate.
spring.jpa.hibernate.ddl-auto=create
# Imprime cada sentencia SQL en la consola.
spring.jpa.show-sql=true

# Spring Batch Conf
#
# ── Por que sigue haciendo falta allow-bean-definition-overriding ────────────
#
# Se intento quitar. No se puede, todavia, y el motivo no es el que parecia.
#
# Durante mucho tiempo se creyo que esta propiedad estaba aqui por la colision
# de DatabaseItemReader (la clase llevaba @Component y ademas se declaraba como
# @Bean con el mismo nombre). Esa colision ya esta resuelta, pero al quitar la
# propiedad la aplicacion sigue sin arrancar, con otro mensaje:
#
#   Invalid bean definition with name 'jobRepository' defined in
#   BatchAutoConfiguration$SpringBootBatchConfiguration: ... there is already
#   [...] defined in BatchConfig
#
# BatchAutoConfiguration de Spring Boot registra jobRepository y jobLauncher sin
# condicion de "solo si no existe ya" -su unica condicion mira si hay un
# DefaultBatchConfiguration o un @EnableBatchProcessing, no si el bean existe-.
# Y BatchConfig declara los dos a proposito: el jobRepository para fijar
# setDatabaseType("MYSQL"), el jobLauncher para elegir el TaskExecutor.
#
# O sea: la propiedad tiene una razon legitima ademas de la que tapaba. Quitarla
# de verdad exige dejar de declarar esos dos beans y quedarse con los de la
# autoconfiguracion -que ademas deduce el tipo de base de datos en vez de fijarlo
# a MySQL-, y eso es un cambio que hay que probar, no suponer.
spring.main.allow-bean-definition-overriding=true
# Prefijo de las tablas de metadatos de Spring Batch.
spring.batch.jdbc.table-prefix=BATCH_
# Spring Batch no crea sus tablas: deben existir ya en la base principal.
spring.batch.jdbc.initialize-schema=never
# No lanzar ningún job al arrancar: los jobs solo se ejecutan desde /batch/run.
spring.batch.job.enabled=false


# ── Ficheros CSV ────────────────────────────────────────────────────────────
# Entrada: ruta dentro del CLASSPATH (src/main/resources/input.csv).
csv.file.path=input.csv
# Salida: ruta del SISTEMA DE FICHEROS, relativa al directorio desde el que se
# arranca la aplicación. El escritor añade al final, nunca vacía el fichero.
csv.output.file.path=BatchProcessor//src//main//resources//output.csv

# ── API REST externa (servicio de ejemplo en el 8081) ───────────────────────
# GET que devuelve un array JSON de entidades (lo usa apiItemReader).
apiToReadUrl=http://localhost:8081/batch/personas
# POST que recibe un array JSON de entidades (lo usa apiItemWriter).
apiToWriteUrl=http://localhost:8081/batch/SavePersonas

# Entidad con la que se ejecutan los jobs. Debe ser coherente con el fichero
# de csv.file.path: el lector valida las cabeceras contra los campos de esta
# clase y rechaza el fichero si no encajan.
entityClass=com.example.BatchProcessor.model.GenericEntity
# GenericEntity




# ── Pool de conexiones de la base principal (HikariCP) ──────────────────────
# Las lee DataSourceConfigProperties. Son obligatorias: sin ellas el pool
# arranca con 0 conexiones y falla.

# Numero maximo de conexiones en el pool
spring.datasource.hikari.maximum-pool-size=10
# Numero minimo de conexiones inactivas
spring.datasource.hikari.minimum-idle=5
# Tiempo en milisegundos antes de cerrar conexiones inactivas
spring.datasource.hikari.idle-timeout=800000
# Tiempo maximo de espera para obtener una conexion del pool
spring.datasource.hikari.connection-timeout=40000
# Tiempo maximo de vida de una conexion en el pool
spring.datasource.hikari.max-lifetime=2800000
# ── Segunda base de datos: destino de la ruta base de datos -> base de datos ──
#
# Otro esquema en el mismo servidor. Se crea sola con createDatabaseIfNotExist.
# Solo hace falta si se usa el escritor secondDatabaseItemWriter.
second.datasource.url=jdbc:mysql://localhost:3306/generic2?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC
second.datasource.username=root
second.datasource.password=1234
second.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
