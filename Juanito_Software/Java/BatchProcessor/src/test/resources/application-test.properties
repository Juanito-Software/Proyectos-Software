# Perfil de test: la aplicacion arranca contra H2 en memoria.
#
# ── Por que un perfil y no un application.properties de test ────────────────
#
# Un src/test/resources/application.properties NO se fusiona con el principal:
# lo sustituye entero, porque Spring carga el primero que encuentra en el
# classpath y el de test va delante. Aqui eso rompe: DatabaseConfig construye
# el DataSource a mano leyendo spring.datasource.hikari.*, y esos campos son
# primitivos sin valor por defecto en DataSourceConfigProperties. Al perder el
# fichero principal llegarian a cero y HikariCP falla al arrancar con un
# maximumPoolSize de 0.
#
# Un perfil se superpone: se carga el application.properties de siempre y esto
# solo pisa lo que hace falta. Los valores de Hikari, las rutas de CSV y la URL
# de la API se heredan intactos.
#
# Se activa con @ActiveProfiles("test") en la clase de test.

# ── Base de datos ───────────────────────────────────────────────────────────
#
# MODE=MySQL hace que H2 acepte la sintaxis de MySQL, que es la que usa la
# aplicacion. DB_CLOSE_DELAY=-1 mantiene viva la base mientras dure la JVM: sin
# eso H2 la destruye al cerrarse la ultima conexion y el pool de Hikari se
# encuentra con que la base ha desaparecido a mitad del arranque.
spring.datasource.url=jdbc:h2:mem:batchprocessor;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ── JPA ─────────────────────────────────────────────────────────────────────
#
# Hibernate avisa de que este dialecto sobra porque sabe deducirlo de la
# conexion. Se declara igualmente, y a proposito: al ser un perfil, lo que no
# se declara aqui se hereda del application.properties principal, que fija
# MySQLDialect. Quitar esta linea no dejaria el dialecto sin definir, dejaria
# Hibernate hablando MySQL contra una base H2. El aviso es el mal menor.
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false

# ── Spring Batch ────────────────────────────────────────────────────────────
#
# En produccion vale 'never' porque las tablas BATCH_ ya existen. En una base
# recien creada en memoria no existe ninguna, y el JobRepository las necesita.
spring.batch.jdbc.initialize-schema=always

# Los jobs no se lanzan solos, igual que en la configuracion principal: los
# tests que ejecutan un job lo lanzan a mano.
spring.batch.job.enabled=false

# ── entityClass NO se declara aqui, y es deliberado ─────────────────────────
#
# Durante un tiempo este perfil fijaba entityClass=GenericEntity porque la
# configuracion principal traia Persona, que no casaba con el input.csv de
# ejemplo. Eso hacia pasar el test de recorrido completo, pero probaba una
# configuracion inventada para el test en lugar de la que trae el repositorio:
# el job podia estar roto de fabrica y los tests seguir en verde.
#
# Corregido el valor por defecto, la linea sobra. Al no declararse, el test
# hereda el entityClass real de application.properties, asi que ejecuta la
# misma configuracion que se encontrara quien clone el proyecto.

# ── Segunda base de datos, tambien en memoria ───────────────────────────────
#
# Nombre distinto al de la principal a proposito: si las dos apuntaran a
# 'batchprocessor', un test de base de datos a base de datos leeria y escribiria
# en el mismo sitio y pasaria sin demostrar nada.
second.datasource.url=jdbc:h2:mem:batchprocessor_destino;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
second.datasource.username=sa
second.datasource.password=
second.datasource.driver-class-name=org.h2.Driver
