[pytest]

# pythonpath = . hace importable el paquete `app` desde los tests.
#
# Sin esta linea, `from app.database import Base, get_db` en conftest.py falla
# con ModuleNotFoundError, pero solo a veces, y ahi esta la trampa:
#
#   python -m pytest   funciona   -> el "-m" mete el directorio actual en sys.path
#   pytest             falla      -> el ejecutable no lo mete
#
# Los tests se escribieron y se probaron con la primera forma; el job de CI usaba
# la segunda. El mismo comando, dos resultados, y la diferencia son tres
# caracteres.
#
# Por que no basta con que pytest encuentre `tests/`: en el modo de importacion
# por defecto, pytest anade al sys.path el primer directorio ANCESTRO del fichero
# de test que no sea un paquete. Como `tests/` no tiene __init__.py, lo que anade
# es `tests/` mismo, no `backend/`. De ahi que `app` quede fuera.
#
# Se declara aqui y no se cambia el comando del CI a `python -m pytest` a
# proposito: asi funciona con cualquiera de las dos formas, y con la de tu IDE,
# que no sabemos cual es.
pythonpath = .

# Donde estan los tests. Evita que pytest recorra el arbol entero -incluido
# venv/- buscando ficheros que parezcan tests.
testpaths = tests
