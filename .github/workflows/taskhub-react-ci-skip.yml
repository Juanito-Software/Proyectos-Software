name: TaskHub_React CI (sin cambios)

# Workflow acompañante del CI de TaskHub_React. No prueba nada; existe por una
# incompatibilidad concreta entre dos cosas que sí queremos:
#
#   1. `taskhub-react-ci.yml` tiene filtros de ruta, para no gastar minutos
#      ejecutando ocho jobs cuando el commit toca otro proyecto del monorepo.
#   2. `ci-ok` («CI en verde») es una comprobación OBLIGATORIA en la rama
#      principal, para que no entre código con los tests en rojo.
#
# Juntas se estorban. Un commit que solo toca, por ejemplo, un proyecto de
# Unity no dispara el workflow de TaskHub, así que la comprobación obligatoria
# nunca llega a ejecutarse — y GitHub no la interpreta como «no aplica» sino
# como «pendiente». Pendiente para siempre: el push queda bloqueado y el
# monorepo entero se vuelve inescribible salvo desde TaskHub_React.
#
# La solución estándar es esta: un workflow con **el mismo nombre de job** que
# se dispara justo en el caso contrario —cuando el commit NO toca
# TaskHub_React— y termina en verde inmediatamente. GitHub ve una comprobación
# llamada «CI en verde» que ha pasado y deja continuar.
#
# Los dos ficheros no pueden dispararse a la vez: sus filtros son
# complementarios (`paths` contra `paths-ignore` sobre la misma lista). Si
# alguna vez se edita esa lista, hay que editarla en LOS DOS o volverá el
# bloqueo — por eso están enumeradas idénticas aquí abajo.

on:
  push:
    branches: [main]
    paths-ignore:
      - 'Juanito_Software/JS/React/TaskHub_React/**'
      - '.github/workflows/taskhub-react-ci.yml'
  pull_request:
    paths-ignore:
      - 'Juanito_Software/JS/React/TaskHub_React/**'
      - '.github/workflows/taskhub-react-ci.yml'

permissions:
  contents: read

jobs:
  # El identificador y el `name` tienen que coincidir EXACTAMENTE con los del
  # workflow real. Lo que GitHub compara con la regla de protección es el
  # nombre visible del job —«CI en verde»—, no el nombre del fichero ni el del
  # workflow. Si aquí pusiera otra cosa, esto no valdría para nada.
  ci-ok:
    name: CI en verde
    runs-on: ubuntu-latest
    steps:
      - name: Sin cambios en TaskHub_React
        run: |
          echo "Este commit no toca TaskHub_React."
          echo "Su pipeline no se ejecuta, así que no hay nada que validar."
