name: TaskHub_React CI

# Este workflow vive dentro del proyecto para que se entienda a qué pertenece,
# pero GitHub solo ejecuta los que están en .github/workflows de la RAÍZ del
# repositorio. Al ser un monorepo, hay que copiarlo o enlazarlo allí; en el
# README del proyecto está explicado.

on:
  push:
    branches: [main]
  pull_request:
  # Permite lanzarlo a mano desde la pestaña Actions.
  workflow_dispatch:

# Permisos del token que GitHub inyecta en cada job.
#
# Por defecto ese token puede ESCRIBIR en el repositorio —crear commits, abrir
# releases, publicar paquetes—, y cualquier acción de terceros que se ejecute
# aquí lo hereda. Este pipeline solo necesita leer el código y descargar
# dependencias, así que se declara lo mínimo y se acabó: si una acción resultara
# comprometida, no tendría con qué tocar el repositorio.
#
# Declarado a nivel de workflow, lo heredan los ocho jobs. Es lo que señalaba
# CodeQL con «workflow does not contain permissions», una alerta por job.
permissions:
  contents: read

# Este pipeline se ejecuta en TODOS los commits del monorepo, no solo en los
# que tocan TaskHub_React.
#
# Tuvo filtros de ruta y se quitaron a propósito. La razón: `ci-ok` es una
# comprobación obligatoria en la rama principal, y una comprobación obligatoria
# que NO se ejecuta se queda pendiente para siempre, bloqueando el push. El
# apaño habitual —un segundo workflow que reporte el mismo nombre cuando el
# filtro no casa— resultó peor que la enfermedad: en un commit que toque
# TaskHub y además otro proyecto se disparan los dos, aparecen dos
# comprobaciones con el mismo nombre y cuál manda es ambiguo. Un pipeline en
# rojo podía quedar tapado por el verde trivial del otro.
#
# Ejecutarlo siempre elimina esa clase de problema entera: hay una única
# comprobación «CI en verde» y significa exactamente lo que dice. El coste son
# un par de minutos de runner en commits que no tocan este proyecto, y en un
# repositorio público esos minutos son gratuitos e ilimitados.

# Si se empuja dos veces seguidas, cancela la ejecución anterior: no tiene
# sentido gastar minutos validando un commit que ya está superado.
concurrency:
  group: taskhub-react-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: Juanito_Software/JS/React/TaskHub_React

jobs:
  # ── Comprobaciones estáticas: rápidas, sin base de datos ────────────────
  static:
    name: Lint y comprobación de tipos
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Juanito_Software/JS/React/TaskHub_React/**/package-lock.json

      - name: Instalar dependencias
        run: npm run install:all

      - name: ESLint
        run: npm run lint

      - name: TypeScript
        run: npm run typecheck

  # ── Tests unitarios del servidor ────────────────────────────────────────
  #
  # Solo lógica pura: validadores, escapado de comodines y campos calculados.
  # No necesitan base de datos, así que corren en segundos y sin servicios.
  server-unit:
    name: Tests unitarios del servidor
    runs-on: ubuntu-latest
    env:
      # El módulo de configuración se evalúa al importar cualquier cosa, así
      # que necesita estas variables aunque los tests no toquen la base de
      # datos. Son valores inertes.
      DATABASE_URL: postgresql://noop:noop@localhost:5432/noop
      JWT_SECRET: secreto-inerte-para-tests-unitarios-del-servidor
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Juanito_Software/JS/React/TaskHub_React/**/package-lock.json

      - name: Instalar dependencias
        run: npm install --include=dev --prefix server

      - name: Vitest con cobertura
        # Con cobertura y umbral, no solo "los tests pasan". Hasta ahora la
        # cobertura del servidor no se medía en ninguna parte: el cliente tenía
        # trinquete y el servidor no, así que una rama nueva sin cubrir entraba
        # sin que nada avisara.
        run: npm run test:coverage --prefix server

      - name: Guardar el informe de cobertura del servidor
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cobertura-servidor
          path: Juanito_Software/JS/React/TaskHub_React/server/coverage/
          retention-days: 7

  # ── Tests del cliente ───────────────────────────────────────────────────
  client-tests:
    name: Tests del cliente y cobertura
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Juanito_Software/JS/React/TaskHub_React/**/package-lock.json

      - name: Instalar dependencias
        run: npm install --include=dev --prefix client

      # Falla si los tests no pasan o si la cobertura cae por debajo de los
      # umbrales definidos en client/vite.config.js.
      - name: Vitest con cobertura
        run: npm run test:coverage --prefix client

      - name: Guardar el informe de cobertura
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: cobertura-cliente
          path: Juanito_Software/JS/React/TaskHub_React/client/coverage/
          retention-days: 7

  # ── Suite end-to-end contra Postgres real ───────────────────────────────
  api-tests:
    name: Tests end-to-end de la API
    runs-on: ubuntu-latest

    # Un Postgres de verdad, no un simulador: la suite depende de índices
    # sobre expresiones, COUNT(*) FILTER, ON CONFLICT y códigos de error
    # concretos. Contra otra base de datos no probaría lo mismo.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskhub
          POSTGRES_PASSWORD: taskhub_ci
          POSTGRES_DB: taskhub_test
        ports:
          - 5432:5432
        # Sin esto, los tests arrancarían antes de que la base acepte
        # conexiones y fallarían de forma intermitente.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://taskhub:taskhub_ci@localhost:5432/taskhub_test
      # Valores de usar y tirar, válidos solo dentro de este contenedor.
      # No son secretos: la base de datos se destruye al terminar el job.
      JWT_SECRET: clave-de-integracion-continua-solo-para-tests-no-produccion
      NODE_ENV: test

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Juanito_Software/JS/React/TaskHub_React/**/package-lock.json

      - name: Instalar dependencias
        run: npm run install:all

      - name: Suite end-to-end
        run: npm run verify

  # ── Build de producción ─────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Juanito_Software/JS/React/TaskHub_React/**/package-lock.json

      - name: Instalar dependencias
        run: npm run install:all

      # NODE_ENV=production reproduce lo que hace Render, incluido que npm
      # omita las devDependencies si no se le fuerza. Fue exactamente el
      # fallo que tumbó el primer despliegue.
      - name: Compilar cliente y servidor
        run: npm run build
        env:
          NODE_ENV: production

      - name: Comprobar que el build contiene lo que debe
        run: |
          test -f server/dist/server.js          || { echo "falta el servidor compilado"; exit 1; }
          test -f server/dist/public/index.html  || { echo "falta el playground"; exit 1; }
          test -f server/dist/client/index.html  || { echo "falta el cliente React"; exit 1; }
          echo "build correcto"

  # ── End-to-end de navegador ─────────────────────────────────────────────
  #
  # La única capa que comprueba que cliente, API y base de datos encajan de
  # verdad. Va aparte porque descarga un navegador y es la más lenta.
  e2e:
    name: End-to-end de navegador
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: taskhub
          POSTGRES_PASSWORD: taskhub_ci
          POSTGRES_DB: taskhub_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://taskhub:taskhub_ci@localhost:5432/taskhub_e2e
      JWT_SECRET: clave-de-integracion-continua-solo-para-e2e-no-produccion
      NODE_ENV: production
      PORT: 3001

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: Juanito_Software/JS/React/TaskHub_React/**/package-lock.json

      - name: Instalar dependencias
        run: npm run install:all

      # El E2E prueba la aplicación compilada, que es la que se despliega, no
      # el servidor de desarrollo de Vite.
      - name: Compilar
        run: npm run build

      - name: Instalar Chromium
        run: npx playwright install --with-deps chromium

      # playwright.config.js arranca el servidor y espera a /api/health.
      - name: Playwright
        run: npm run test:e2e

      - name: Guardar el informe si algo falla
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: informe-playwright
          path: Juanito_Software/JS/React/TaskHub_React/playwright-report/
          retention-days: 7

  # ── Auditoría de dependencias ───────────────────────────────────────────
  security:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '22'

      # Política: solo bloquean las vulnerabilidades ALTAS y CRÍTICAS.
      #
      # Con --audit-level=moderate el pipeline acabaría en rojo permanente por
      # avisos de dependencias transitivas de herramientas de desarrollo, y un
      # CI que siempre está rojo deja de mirarse. Las moderadas y bajas se
      # revisan por Dependabot sin cortar el trabajo.
      #
      # **Y se distingue «hay vulnerabilidades» de «no he podido preguntar».**
      #
      # `npm audit` devuelve el mismo código de salida en los dos casos, y eso
      # tumbó este pipeline una vez: el registro de npm respondió 503 durante
      # una caída suya, el job se puso rojo, `ci-ok` con él y el despliegue no
      # llegó a lanzarse. No había ninguna vulnerabilidad; simplemente npm
      # estaba caído.
      #
      # Un CI que se pone rojo por una avería ajena es un CI que se deja de
      # mirar, y aquí además bloqueaba producción. Así que: se reintenta tres
      # veces, y si el registro sigue sin responder se avisa en voz alta pero
      # **no** se falla — no poder comprobar algo no es lo mismo que haber
      # encontrado un problema. Si el audit sí responde y encuentra algo alto o
      # crítico, se falla como siempre.
      - name: npm audit de servidor y cliente
        working-directory: Juanito_Software/JS/React/TaskHub_React
        run: |
          incompleto=0

          auditar() {
            ruta="$1"
            for intento in 1 2 3; do
              if salida=$(cd "$ruta" && npm audit --audit-level=high 2>&1); then
                echo "[$ruta] sin vulnerabilidades altas ni críticas."
                return 0
              fi

              if printf '%s' "$salida" | grep -qiE 'Service Unavailable|audit endpoint returned an error|ENOTFOUND|ETIMEDOUT|ECONNRESET|socket hang up|EAI_AGAIN'; then
                echo "[$ruta] intento $intento: el registro de npm no responde."
                if [ "$intento" -lt 3 ]; then
                  sleep $((intento * 20))
                fi
                continue
              fi

              echo "[$ruta] vulnerabilidades encontradas:"
              printf '%s\n' "$salida"
              return 1
            done

            echo "::warning::[$ruta] No se pudo consultar el registro de npm tras 3 intentos. La auditoría NO se ha realizado."
            return 2
          }

          for proyecto in server client; do
            auditar "$proyecto" || case $? in
              1) exit 1 ;;
              2) incompleto=1 ;;
            esac
          done

          if [ "$incompleto" = "1" ]; then
            echo "Auditoría incompleta por una avería del registro de npm, no por hallazgos."
            echo "Conviene relanzar este job cuando npm se recupere."
          fi

  # ── Puerta final ────────────────────────────────────────────────────────
  #
  # Un único job del que colgar la regla de protección de rama, en lugar de
  # tener que marcar los cinco anteriores uno a uno y acordarse de actualizar
  # la lista cada vez que se añada otro.
  ci-ok:
    name: CI en verde
    runs-on: ubuntu-latest
    needs: [static, server-unit, client-tests, api-tests, e2e, build, security]
    if: always()
    steps:
      - name: Comprobar que ningún job ha fallado
        # Este job no clona el repositorio: solo mira el resultado de los
        # demás. Hay que anular el working-directory heredado del workflow,
        # porque esa carpeta no existe si no se ha hecho checkout.
        working-directory: .
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Algún job ha fallado."
            exit 1
          fi
          echo "Todos los jobs en verde."

  # ── Despliegue ──────────────────────────────────────────────────────────
  #
  # Aquí es donde el CI deja de ser decorativo.
  #
  # Antes de esto, Render tenía Auto-Deploy activado y publicaba por su cuenta
  # en cuanto llegaba un commit a `main`. Los dos procesos corrían en paralelo
  # sin mirarse: el pipeline podía terminar en rojo veinte minutos después de
  # que la versión rota ya estuviera sirviendo tráfico. Ochocientos tests que
  # no pueden impedir un despliegue son una red de seguridad decorativa.
  #
  # Ahora el único camino a producción pasa por `ci-ok`. Requiere haber
  # **desactivado Auto-Deploy en Render**: si sigue encendido, este job añade
  # un segundo despliegue en lugar de sustituir al primero, y el problema se
  # queda igual. Está explicado en el README.
  deploy:
    name: Desplegar en Render
    runs-on: ubuntu-latest
    needs: [ci-ok]

    # Tres condiciones, y las tres hacen falta:
    #
    # - `needs: [ci-ok]` es la puerta. `ci-ok` corre con `if: always()` y sale
    #   con código 1 si algo falló, así que un pipeline en rojo lo deja en
    #   estado `failure` y este job ni se lanza.
    # - `github.ref` restringe a `main`: una rama de trabajo no despliega.
    # - `event_name == 'push'` descarta los pull requests (que además vienen
    #   sin secretos) y el disparo manual, para que nadie publique sin querer
    #   desde la pestaña Actions.
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # El workflow entero cancela ejecuciones superadas, y para compilar y
    # probar está bien. Para desplegar no: cortar a la mitad deja el despliegue
    # en un estado que nadie ha decidido. Este job usa su propio grupo y no se
    # cancela; si llegan dos commits seguidos, el segundo espera.
    concurrency:
      group: taskhub-react-deploy
      cancel-in-progress: false

    # Declarar el entorno permite exigir aprobación manual desde los ajustes
    # del repositorio sin tocar este fichero, y deja el historial de
    # despliegues en la pestaña Environments.
    environment: production

    steps:
      # Con los filtros de ruta fuera, este job se ejecuta en cada commit a la
      # rama principal — también en los que no tocan TaskHub. Republicar lo
      # mismo una y otra vez no rompe nada, pero gasta tiempo de construcción
      # en Render, que en el plan gratuito sí está limitado. Así que el filtro
      # que se quitó del disparador reaparece aquí, que es donde importa.
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Comprobar si el commit toca TaskHub_React
        id: cambios
        working-directory: .
        run: |
          anterior="${{ github.event.before }}"

          # `before` viene a ceros en el primer push de una rama, y puede
          # apuntar a un commit inexistente tras un force-push. Sin poder
          # comparar, se despliega: equivocarse desplegando de más es molesto,
          # equivocarse desplegando de menos deja producción desactualizada
          # sin que nadie se entere.
          if [ -z "$anterior" ] \
             || [ "$anterior" = "0000000000000000000000000000000000000000" ] \
             || ! git cat-file -e "${anterior}^{commit}" 2>/dev/null; then
            echo "Sin punto de comparación fiable: se despliega por precaución."
            echo "desplegar=si" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if git diff --name-only "$anterior" "${{ github.sha }}" \
               | grep -qE '^(Juanito_Software/JS/React/TaskHub_React/|\.github/workflows/taskhub-react-ci\.yml)'; then
            echo "El commit toca TaskHub_React: se despliega."
            echo "desplegar=si" >> "$GITHUB_OUTPUT"
          else
            echo "El commit no toca TaskHub_React: no hay nada nuevo que publicar."
            echo "desplegar=no" >> "$GITHUB_OUTPUT"
          fi

      # Los secretos no están disponibles en el `if` del job —el contexto
      # `secrets` no se evalúa ahí—, así que la comprobación va aquí. Sin
      # esto, un secreto mal escrito produciría una petición sin credencial,
      # curl devolvería 401 o 000 y habría que deducirlo del error: mejor
      # decirlo por su nombre antes de intentar nada.
      - name: Comprobar que las credenciales están configuradas
        if: steps.cambios.outputs.desplegar == 'si'
        working-directory: .
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          faltan=""
          [ -z "$RENDER_API_KEY" ] && faltan="$faltan RENDER_API_KEY"
          [ -z "$RENDER_SERVICE_ID" ] && faltan="$faltan RENDER_SERVICE_ID"

          if [ -n "$faltan" ]; then
            echo "Faltan secretos en los ajustes del repositorio:$faltan"
            exit 1
          fi

      # Se dispara por la API y no por el deploy hook. El hook contesta 200 sin
      # decir qué despliegue ha creado, así que para esperarlo habría que
      # consultar el más reciente y confiar en que sea el nuestro; si alguien
      # redespliega a mano en ese momento, esperaríamos al equivocado. La API
      # devuelve el despliegue con su id y esa ambigüedad desaparece.
      #
      # Las credenciales van por `env` y no se interpolan dentro del script:
      # interpolarlas en el `run` mete el valor en el fichero que ejecuta el
      # runner, que es el patrón por el que un secreto acaba en un registro.
      - name: Lanzar el despliegue
        id: lanzar
        if: steps.cambios.outputs.desplegar == 'si'
        working-directory: .
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail

          # Se anota el instante previo por si hay que localizar el despliegue
          # por fecha, cosa que solo pasa en el caso 202 de más abajo.
          antes=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          cuerpo=$(mktemp)

          codigo=$(curl --silent --show-error --location \
                        --request POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
                        --header "Authorization: Bearer ${RENDER_API_KEY}" \
                        --header "Content-Type: application/json" \
                        --data '{"clearCache":"do_not_clear"}' \
                        --output "$cuerpo" --write-out '%{http_code}')

          if [ "$codigo" != "201" ] && [ "$codigo" != "202" ]; then
            echo "Render ha respondido $codigo al lanzar el despliegue."
            # El cuerpo de error de Render trae un `message` descriptivo y
            # ningún dato sensible. La clave nunca viaja de vuelta.
            jq -r '.message // "sin mensaje"' "$cuerpo" 2>/dev/null || cat "$cuerpo"
            exit 1
          fi

          id=$(jq -r '.id // empty' "$cuerpo" 2>/dev/null || true)

          # El 201 trae el despliegue completo. El 202 significa «encolado» y
          # llega sin cuerpo, así que ahí sí toca buscarlo: se pide el más
          # reciente creado a partir del instante anterior al POST, que acota
          # la búsqueda a despliegues que no existían antes de pedirlo.
          if [ -z "$id" ]; then
            echo "Respuesta $codigo sin id; se localiza el despliegue por fecha."
            id=$(curl --silent --show-error --location \
                      --header "Authorization: Bearer ${RENDER_API_KEY}" \
                      "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys?limit=1&createdAfter=${antes}" \
                 | jq -r '.[0].deploy.id // empty')
          fi

          if [ -z "$id" ]; then
            echo "No se ha podido determinar qué despliegue se ha creado."
            exit 1
          fi

          echo "Despliegue lanzado: $id (HTTP $codigo)."
          echo "deploy_id=$id" >> "$GITHUB_OUTPUT"

      # Aquí es donde este job deja de mentir.
      #
      # Antes terminaba en cuanto Render aceptaba la petición, así que una
      # compilación que fallara dentro de Render dejaba el CI en verde y la web
      # sirviendo la versión anterior. Un verde que no significaba lo que
      # parecía. Ahora se espera al estado final y solo `live` cuenta como
      # éxito.
      - name: Esperar a que el despliegue termine
        if: steps.cambios.outputs.desplegar == 'si'
        working-directory: .
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
          DEPLOY_ID: ${{ steps.lanzar.outputs.deploy_id }}
        run: |
          set -uo pipefail

          limite=$(( $(date +%s) + 15 * 60 ))
          fallos_seguidos=0

          while :; do
            estado=$(curl --silent --show-error --location --max-time 30 \
                          --header "Authorization: Bearer ${RENDER_API_KEY}" \
                          "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}" \
                     | jq -r '.status // empty')

            case "$estado" in
              live)
                echo "Despliegue terminado: live."
                exit 0
                ;;
              build_failed|update_failed|pre_deploy_failed|canceled|deactivated)
                echo "El despliegue ha terminado en estado '$estado'."
                echo "Registro completo: https://dashboard.render.com/web/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}"
                exit 1
                ;;
              created|queued|build_in_progress|update_in_progress|pre_deploy_in_progress)
                fallos_seguidos=0
                echo "En curso ($estado)…"
                ;;
              "")
                # Un fallo puntual de red o un 429 no deben tumbar el
                # despliegue. Se toleran unos cuantos seguidos y se abandona
                # solo si no hay manera, para no cambiar un verde que miente
                # por un rojo que miente.
                fallos_seguidos=$(( fallos_seguidos + 1 ))
                echo "Sin respuesta de la API (intento $fallos_seguidos)."
                if [ "$fallos_seguidos" -ge 5 ]; then
                  echo "Cinco consultas seguidas sin respuesta: se abandona."
                  exit 1
                fi
                ;;
              *)
                # Un estado que no conocemos no se interpreta como bueno: si
                # Render añade uno nuevo, preferimos enterarnos por un rojo.
                echo "Estado no reconocido: '$estado'."
                exit 1
                ;;
            esac

            if [ "$(date +%s)" -ge "$limite" ]; then
              echo "Quince minutos sin alcanzar un estado final. Se abandona."
              echo "Puede que el despliegue termine bien más tarde; compruébalo en el panel."
              exit 1
            fi

            sleep 10
          done

      # Y aquí es donde se comprueba lo que de verdad importa. Que Render diga
      # `live` y que la aplicación conteste no son lo mismo: el proceso puede
      # arrancar y morir al primer tráfico, o quedarse sin base de datos.
      #
      # La URL se pregunta a la API en vez de escribirla aquí, para que no haya
      # una dirección a mano que se quede desactualizada sin que nadie lo note.
      - name: Comprobar que la aplicación responde
        if: steps.cambios.outputs.desplegar == 'si'
        working-directory: .
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -uo pipefail

          url=$(curl --silent --show-error --location \
                     --header "Authorization: Bearer ${RENDER_API_KEY}" \
                     "https://api.render.com/v1/services/${RENDER_SERVICE_ID}" \
                | jq -r '.serviceDetails.url // empty')

          if [ -z "$url" ]; then
            echo "La API no ha devuelto la URL pública del servicio."
            exit 1
          fi

          echo "Comprobando ${url}/api/health"

          for intento in $(seq 1 10); do
            codigo=$(curl --silent --location --max-time 30 \
                          --output /dev/null --write-out '%{http_code}' \
                          "${url}/api/health" || echo "000")

            if [ "$codigo" = "200" ]; then
              echo "La aplicación responde 200 (intento $intento)."
              exit 0
            fi

            echo "Respuesta $codigo (intento $intento de 10)."
            sleep 10
          done

          echo "La aplicación no ha respondido 200 tras el despliegue."
          exit 1
